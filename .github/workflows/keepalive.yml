name: Keep Actions Alive
# Monthly keepalive: pushes a commit so GitHub doesn't auto-disable
# scheduled workflows after 60 days of repo inactivity (public repos).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push keepalive commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "last-keepalive=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .last-keepalive
          git add .last-keepalive
          git commit -m "keepalive" || echo "Nothing to commit"
          git push
