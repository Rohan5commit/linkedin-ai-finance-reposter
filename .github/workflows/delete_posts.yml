name: Delete LinkedIn Posts

on:
  workflow_dispatch:
    inputs:
      share_urns:
        description: "Comma or newline separated share/ugc URNs to delete"
        required: true
        type: string

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.3

      - name: Delete requested posts
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          DELETE_SHARE_URNS: ${{ inputs.share_urns }}
        run: python src/delete_linkedin_posts.py
