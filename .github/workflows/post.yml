name: Post Trending AI and Finance News
# Scheduled: Weekly Monday 09:00 UTC (1 post per week)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

concurrency:
  group: linkedin-reposter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repost:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore repost history cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: repost-history-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            repost-history-${{ github.ref_name }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run repost automation
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NIM_MODEL: meta/llama-3.1-8b-instruct
          LINKEDIN_DIRECT_REPOST_ONLY: "true"
          DIRECT_REPOST_COMMENTARY_STYLE: "none"
          DIRECT_REPOST_ARTICLE_FALLBACK: "true"
          RANDOMIZE_WEEKLY_RUN_DAYS: "false"
          RANDOM_SCHEDULE_SEED: ${{ github.repository }}
          REPOST_HISTORY_FILE: .cache/repost_history.json
          REPOST_HISTORY_MAX_ENTRIES: "500"
          REPOST_COOLDOWN_POSTS: "120"
          ARTICLE_HISTORY_FILE: .cache/article_history.json
          ARTICLE_HISTORY_MAX_ENTRIES: "500"
          ARTICLE_COOLDOWN_POSTS: "120"
          MAX_REPOST_AGE_DAYS: "7"
        run: python src/main.py

      - name: Success log
        if: ${{ success() }}
        run: echo "LinkedIn repost completed successfully."

      - name: Failure log
        if: ${{ failure() }}
        run: |
          echo "LinkedIn repost failed. Inspect logs for details."
          exit 1
